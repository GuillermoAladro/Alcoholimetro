<svg xmlns="http://www.w3.org/2000/svg" width="550" height="840" viewBox="0 0 550 840">
<text x="20" y="26" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#163047">CIRCUITO CORREGIDO DE REFERENCIA</text>
<text x="20" y="45" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#526576">Auditor 6.1-S | Arquitectura condicionada, no esquema de fabricación</text>
<rect x="20" y="65" width="510" height="57" rx="7" fill="#fff0ef" stroke="#b33236"/>
<text x="32" y="86" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#b33236">NO LIBERADO PARA ENERGIZACIÓN</text>
<text x="32" y="105" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">Bloques y referencias pendientes de selección/ensayo. El C14 actual no tiene mapa aprobado.</text>
<rect x="20" y="145" width="235" height="64" rx="7" fill="#f3f6f8" stroke="#163047"/>
<text x="32" y="166" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#163047">Entrada Schuko - C13/C14</text>
<text x="32" y="185" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">Dos conductores activos reversibles</text>
<text x="32" y="199" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">PE continuo, sin fusible ni interruptor</text>
<rect x="295" y="145" width="235" height="64" rx="7" fill="#edf7ef" stroke="#238048"/>
<text x="307" y="166" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#238048">Distribución de PE</text>
<text x="307" y="185" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">FG + cuerpo + frontal + caja + cajón</text>
<text x="307" y="199" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">Uniones mecánicas y flexibles definidas</text>
<line x1="255" y1="172" x2="295" y2="172" stroke="#238048" stroke-width="2"/>
<rect x="20" y="235" width="235" height="65" rx="7" fill="#f3f6f8" stroke="#163047"/>
<text x="32" y="256" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#163047">Protección AC + corte bipolar</text>
<text x="32" y="275" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">Referencia, esquema y arranque compatibles</text>
<text x="32" y="289" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">OFF no aísla la zona anterior al corte</text>
<line x1="135" y1="209" x2="135" y2="235" stroke="#163047" stroke-width="1.5"/>
<rect x="20" y="325" width="510" height="75" rx="7" fill="#f3f6f8" stroke="#163047"/>
<text x="32" y="346" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#163047">LRS-50-5 / fuente apta para carga real</text>
<text x="32" y="365" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">Bornes: 1 AC/L | 2 AC/N | 3 FG | 4 -V | 5 +V</text>
<text x="32" y="379" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">Tensión, rizado y transitorios en todas las cargas deben cumplir sus límites.</text>
<line x1="135" y1="300" x2="135" y2="325" stroke="#163047" stroke-width="1.5"/>
<line x1="412" y1="209" x2="412" y2="312" stroke="#238048" stroke-width="2"/>
<line x1="412" y1="312" x2="335" y2="312" stroke="#238048" stroke-width="2"/>
<line x1="335" y1="312" x2="335" y2="325" stroke="#238048" stroke-width="2"/>
<rect x="20" y="425" width="510" height="64" rx="7" fill="#e9f6f6" stroke="#007f82"/>
<text x="32" y="446" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#007f82">Distribuidor DC protegido junto a fuente</text>
<text x="32" y="465" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">Protección de troncal + cuatro positivos protegidos antes del cable fino</text>
<text x="32" y="479" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">Retornos dedicados; umbrales, resistencia, SOA y temperatura por verificar</text>
<line x1="135" y1="400" x2="135" y2="425" stroke="#b33236" stroke-width="2"/>
<line x1="425" y1="400" x2="425" y2="425" stroke="#526576" stroke-width="2"/>
<line x1="60" y1="489" x2="60" y2="788" stroke="#b33236" stroke-width="2.5"/>
<line x1="490" y1="489" x2="490" y2="788" stroke="#526576" stroke-width="2.5"/>
<rect x="100" y="515" width="350" height="59" rx="7" fill="#ffffff" stroke="#007f82"/>
<text x="112" y="536" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#007f82">P1 - Raspberry Pi por micro-USB</text>
<text x="112" y="555" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">Conservar F1; medir red5V después de F1</text>
<text x="112" y="569" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">Incluye cámara CSI + adaptador Wi-Fi USB</text>
<line x1="60" y1="544" x2="100" y2="544" stroke="#b33236" stroke-width="2"/>
<line x1="450" y1="544" x2="490" y2="544" stroke="#526576" stroke-width="2"/>
<rect x="100" y="585" width="350" height="59" rx="7" fill="#ffffff" stroke="#007f82"/>
<text x="112" y="606" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#007f82">P2 - SumUp Solo</text>
<text x="112" y="625" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">Etapa USB/cable compatibles y validados</text>
<text x="112" y="639" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">En banco inicial: cargador autorizado</text>
<line x1="60" y1="614" x2="100" y2="614" stroke="#b33236" stroke-width="2"/>
<line x1="450" y1="614" x2="490" y2="614" stroke="#526576" stroke-width="2"/>
<rect x="100" y="655" width="350" height="59" rx="7" fill="#ffffff" stroke="#007f82"/>
<text x="112" y="676" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#007f82">P3 - Monitor HDMI</text>
<text x="112" y="695" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">Solo Power IN para potencia principal</text>
<text x="112" y="709" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">HDMI a Pi; verificar masas/H5V/backfeed</text>
<line x1="60" y1="684" x2="100" y2="684" stroke="#b33236" stroke-width="2"/>
<line x1="450" y1="684" x2="490" y2="684" stroke="#526576" stroke-width="2"/>
<rect x="100" y="725" width="350" height="59" rx="7" fill="#ffffff" stroke="#007f82"/>
<text x="112" y="746" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#007f82">P4 - ZE29A</text>
<text x="112" y="765" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">Pin1 Vin | Pin2 GND | 4,7-5,3V</text>
<text x="112" y="779" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#526576">Pi8 TX a RX4; TX3 a Pi10 RX,3,3V</text>
<line x1="60" y1="754" x2="100" y2="754" stroke="#b33236" stroke-width="2"/>
<line x1="450" y1="754" x2="490" y2="754" stroke="#526576" stroke-width="2"/>
<text x="20" y="817" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#526576">P1-P4: protecciones funcionales por definir; ningún valor nominal de fusible se valida aquí.</text>
</svg>

name: Publicar SVG Astra
on:
  push:
    branches: [main]
    paths:
      - 'avatares SVG - Astra/.upload/manifest.json'
permissions:
  contents: write
concurrency:
  group: astra-svg-publication
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Publicar SVG Astra verificados')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restaurar los archivos verificados
        shell: python
        run: |
          from pathlib import Path
          import gzip, hashlib, json, shutil
          root = Path.cwd()
          folder = root / 'avatares SVG - Astra'
          staging = folder / '.upload'
          manifest = json.loads((staging / 'manifest.json').read_text())
          for item in manifest['files']:
              target = (root / item['path']).resolve()
              if not target.is_relative_to(folder.resolve()) or '.upload' in target.relative_to(folder.resolve()).parts:
                  raise ValueError('Ruta de salida no permitida')
              data = gzip.decompress(b''.join((staging / part).read_bytes() for part in item['parts']))
              if len(data) != item['bytes'] or hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise ValueError('El contenido no coincide con el archivo revisado')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          shutil.rmtree(staging)
      - name: Guardar los SVG en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'avatares SVG - Astra'
          git commit -m "Añadir avatares SVG Astra verificados"
          git pull --rebase origin main
          git push origin HEAD:main

name: Temporary Yorgi avatar import
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-yorgi-20261029.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Import original Yorgi PNG with integrity verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import os, json, base64, hashlib, io, zipfile, time, tempfile, subprocess
          import urllib.request, urllib.error, urllib.parse
          root = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          temporary = '.avatar-yorgi-transfer-20261029/'
          target = 'animaciones/Avatar Yorgi.png'
          expected = 'bbad3cbd07559712de9fb2927b690dd2e75ebca7045187def3bd20eea93d61fc'
          def api(method, path, data=None):
              request = urllib.request.Request(root + path, data=None if data is None else json.dumps(data).encode(), method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and method == 'GET': return None
                  raise
          def contents(path):
              return '/contents/' + urllib.parse.quote(path, safe='/')
          def get_file(path):
              return api('GET', contents(path) + '?ref=main')
          def put_file(path, content, message, sha=None):
              data = {'message': message, 'content': base64.b64encode(content).decode(), 'branch': 'main'}
              if sha: data['sha'] = sha
              return api('PUT', contents(path), data)
          def delete_file(path):
              item = get_file(path)
              if item: api('DELETE', contents(path), {'message': 'Remove temporary Yorgi transfer metadata', 'sha': item['sha'], 'branch': 'main'})
          with tempfile.TemporaryDirectory() as folder:
              private = os.path.join(folder, 'private.pem')
              public = os.path.join(folder, 'public.pem')
              subprocess.run(['openssl', 'genpkey', '-algorithm', 'RSA', '-pkeyopt', 'rsa_keygen_bits:4096', '-out', private], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              subprocess.run(['openssl', 'pkey', '-in', private, '-pubout', '-out', public], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              with open(public, 'rb') as source: put_file(temporary + 'public.pem', source.read(), 'Publish one-time public key for Yorgi image transfer')
              envelope = None
              for attempt in range(150):
                  item = get_file(temporary + 'envelope.json')
                  if item:
                      envelope = json.loads(base64.b64decode(item['content']))
                      break
                  time.sleep(3)
              if envelope is None: raise RuntimeError('Timed out waiting for encrypted image transfer URL')
              pieces = []
              for block in envelope['blocks']:
                  result = subprocess.run(['openssl', 'pkeyutl', '-decrypt', '-inkey', private, '-pkeyopt', 'rsa_padding_mode:oaep', '-pkeyopt', 'rsa_oaep_md:sha256', '-pkeyopt', 'rsa_mgf1_md:sha256'], input=base64.b64decode(block), capture_output=True, check=True)
                  pieces.append(result.stdout)
              download_url = b''.join(pieces).decode()
              parsed = urllib.parse.urlparse(download_url)
              if parsed.scheme != 'https' or parsed.hostname != 'content.invideo.io': raise RuntimeError('Unexpected asset host')
              with urllib.request.urlopen(download_url, timeout=90) as source: archive_bytes = source.read(20_000_001)
              if len(archive_bytes) > 20_000_000: raise RuntimeError('Archive exceeds permitted size')
              image = None
              with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
                  for item in archive.infolist():
                      if item.is_dir() or item.file_size > 5_000_000: continue
                      payload = archive.read(item)
                      if hashlib.sha256(payload).hexdigest() == expected:
                          image = payload
                          break
              if image is None or not image.startswith(b'\x89PNG\r\n\x1a\n'): raise RuntimeError('Original verified PNG not found')
              blob = hashlib.sha1(b'blob ' + str(len(image)).encode() + b'\0' + image).hexdigest()
              existing = get_file(target)
              if existing and existing['sha'] != blob: raise RuntimeError('Refusing to overwrite a different Yorgi image')
              if not existing: put_file(target, image, 'Add original Avatar Yorgi PNG')
              uploaded = get_file(target)
              if uploaded['sha'] != blob: raise RuntimeError('Uploaded file failed integrity verification')
              delete_file(temporary + 'envelope.json')
              delete_file(temporary + 'public.pem')
              print('Verified original PNG uploaded:', target, 'bytes:', len(image), 'sha256:', expected)

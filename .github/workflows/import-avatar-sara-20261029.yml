name: Temporary Avatar Sara import
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-avatar-sara-20261029.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Import verified Avatar Sara image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, subprocess, tempfile, time, urllib.error, urllib.parse, urllib.request, zipfile
          repo = os.environ['GH_REPO']
          root = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Avatar-Sara-Import'}
          pubpath = '.avatar-transfer-sara-20261029/public.pem'
          sourcepath = '.avatar-transfer-sara-20261029/source.json'
          target = 'animaciones/Avatar Sara.png'
          expected = '26a6942abedb35af9041982a6b535c3d73da2d57352a09b43152d7c8fa542b9a'
          def api(method, path, data=None, optional=False):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(root + path, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  if optional and e.code == 404:
                      return None
                  raise RuntimeError('GitHub API request failed: ' + str(e.code)) from None
          def content_path(path):
              return '/contents/' + urllib.parse.quote(path, safe='/')
          if api('GET', content_path(target) + '?ref=main', optional=True):
              raise RuntimeError('Target already exists; refusing to overwrite')
          with tempfile.TemporaryDirectory() as work:
              key = os.path.join(work, 'private.pem')
              subprocess.run(['openssl', 'genpkey', '-algorithm', 'RSA', '-pkeyopt', 'rsa_keygen_bits:3072', '-out', key], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              public = subprocess.check_output(['openssl', 'pkey', '-in', key, '-pubout'])
              api('PUT', content_path(pubpath), {'message': 'Prepare temporary encrypted avatar transfer', 'content': base64.b64encode(public).decode(), 'branch': 'main'})
              packet = None
              for attempt in range(150):
                  entry = api('GET', content_path(sourcepath) + '?ref=main', optional=True)
                  if entry:
                      packet = json.loads(base64.b64decode(entry['content']))
                      break
                  time.sleep(4)
              if packet is None:
                  raise RuntimeError('No transfer source received within the time limit')
              chunks = packet.get('chunks', [])
              if not 1 <= len(chunks) <= 30:
                  raise RuntimeError('Invalid encrypted transfer metadata')
              plaintext = b''
              for chunk in chunks:
                  plaintext += subprocess.check_output(['openssl', 'pkeyutl', '-decrypt', '-inkey', key, '-pkeyopt', 'rsa_padding_mode:oaep', '-pkeyopt', 'rsa_oaep_md:sha256', '-pkeyopt', 'rsa_mgf1_md:sha256'], input=base64.b64decode(chunk, validate=True))
              source = json.loads(plaintext)
              url = source['url']
              parsed = urllib.parse.urlparse(url)
              if parsed.scheme != 'https' or parsed.hostname != 'content.invideo.io':
                  raise RuntimeError('Unexpected source host')
              try:
                  with urllib.request.urlopen(url, timeout=90) as r:
                      package = r.read(25000001)
              except Exception:
                  raise RuntimeError('Image package download failed') from None
              if len(package) > 25000000:
                  raise RuntimeError('Image package exceeds the transfer size limit')
              image = None
              if package.startswith(b'\x89PNG\r\n\x1a\n'):
                  if hashlib.sha256(package).hexdigest() == expected:
                      image = package
              else:
                  with zipfile.ZipFile(io.BytesIO(package)) as archive:
                      for member in archive.infolist():
                          if member.file_size > 10000000 or not member.filename.lower().endswith('.png'):
                              continue
                          candidate = archive.read(member)
                          if hashlib.sha256(candidate).hexdigest() == expected:
                              image = candidate
                              break
              if image is None:
                  raise RuntimeError('Original Avatar Sara PNG was not found with the expected checksum')
              blob = api('POST', '/git/blobs', {'content': base64.b64encode(image).decode(), 'encoding': 'base64'})['sha']
              for attempt in range(4):
                  head = api('GET', '/git/ref/heads/main')['object']['sha']
                  tree = api('GET', '/git/commits/' + head)['tree']['sha']
                  changes = [{'path': target, 'mode': '100644', 'type': 'blob', 'sha': blob}, {'path': pubpath, 'mode': '100644', 'type': 'blob', 'sha': None}, {'path': sourcepath, 'mode': '100644', 'type': 'blob', 'sha': None}]
                  newtree = api('POST', '/git/trees', {'base_tree': tree, 'tree': changes})['sha']
                  commit = api('POST', '/git/commits', {'message': 'Add Avatar Sara character sheet', 'tree': newtree, 'parents': [head]})['sha']
                  try:
                      api('PATCH', '/git/refs/heads/main', {'sha': commit, 'force': False})
                      print('Imported:', target, 'blob:', blob, 'commit:', commit)
                      break
                  except RuntimeError:
                      if attempt == 3:
                          raise
                      time.sleep(2)
          PY

name: Temporary Gabacho avatar import
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-avatar-gabacho-20261029.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Import and verify the original Gabacho PNG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, urllib.error, urllib.parse, urllib.request, zipfile
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'GuillermoAladro/Alcoholimetro'
          source = 'https://content.invideo.io/exports/87d759d4-df49-4e92-adb5-f7d80f61aa20/c2eabc2d-bb28-428c-a0ed-dc7adf5e1034/c2eabc2d-bb28-428c-a0ed-dc7adf5e1034?Expires=1793351677&Signature=t5RNWB~F~O5rjTUmSbwzN-2uIfUZD54Ps2BZSuNpNVJ32DOJmuJ3N9qubEXuvzWAGJeaIizXqdNtMCEOadMH6a9TrKC1JKCEVumLqgxAVD3jbz8~f2SRjnkdEIy319I5NftgQIEEuy8HHz090xQJlSnkhMUxV-3gJjPE6y0F159iR4-xiXxVJL8PprQpUNuj08AG65fwT1XCHHe1KSjqR6tR9HADvdmnd2SufnouL8BN0hVLIk5yu7D6rGztVVHOX-w9m4q6CLQorn-TSszOFc19PTHjIPdsq96~srNxw16UljKGOzIjRu0tjBVd8D2mrxzR8dbVwhjfOB91Fj0~DA__&Key-Pair-Id=KX9I6OACHF5M3'
          expected_hash = 'fc874dbc4c8d42c47017fe9148654d789ace75c36589208caf4deaadb98a50a4'
          expected_blob = '7f149062117236cbf721e134ca482c7a86084fb9'
          expected_size = 2129501
          target = 'animaciones/Avatar Gabacho.png'
          req = urllib.request.Request(source, headers={'User-Agent': 'Avatar-Import'})
          with urllib.request.urlopen(req, timeout=90) as response:
              archive_data = response.read(30_000_001)
          if len(archive_data) > 30_000_000:
              raise RuntimeError('Unexpectedly large transfer archive')
          matches = []
          with zipfile.ZipFile(io.BytesIO(archive_data)) as archive:
              for info in archive.infolist():
                  if info.is_dir() or info.file_size != expected_size:
                      continue
                  candidate = archive.read(info)
                  if hashlib.sha256(candidate).hexdigest() == expected_hash:
                      matches.append(candidate)
          if not matches:
              raise RuntimeError('Original PNG hash was not found in the transfer archive')
          data = matches[0]
          assert data.startswith(b'\x89PNG\r\n\x1a\n')
          assert hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest() == expected_blob
          api = 'https://api.github.com/repos/' + repo + '/contents/' + urllib.parse.quote(target, safe='/')
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'Avatar-Import', 'Content-Type': 'application/json'}
          try:
              with urllib.request.urlopen(urllib.request.Request(api + '?ref=main', headers=headers), timeout=30) as response:
                  existing = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              existing = None
          if existing is not None:
              if existing.get('sha') != expected_blob:
                  raise RuntimeError('Refusing to overwrite an existing different avatar')
              print('Identical avatar already exists:', existing['html_url'])
          else:
              payload = {'message': 'Add Avatar Gabacho with curly hair and French details', 'content': base64.b64encode(data).decode('ascii'), 'branch': 'main'}
              request = urllib.request.Request(api, data=json.dumps(payload).encode(), headers=headers, method='PUT')
              with urllib.request.urlopen(request, timeout=90) as response:
                  result = json.load(response)
              assert result['content']['sha'] == expected_blob
              print('Verified original PNG:', result['content']['html_url'])
              print('Commit:', result['commit']['sha'])
          PY

name: Preparar la referencia original de 00045
on:
  push:
    branches: [revision-2d-00101-paradigma]
    paths: ['.github/workflows/revision-00101-temporal.yml','.revision-00101/exportar.py']
permissions:
  contents: write
jobs:
  referencia:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .revision-00101
            Animaciones 2D/escenas
            Animaciones 2D/herramientas
            Animaciones 2D/motor
            Animaciones 2D/personajes
            Animaciones 2D/ver.html
      - run: python -m pip install --quiet playwright==1.55.0 Pillow==11.3.0
      - run: python .revision-00101/exportar.py
      - run: |
          set -euo pipefail
          git add --sparse -- '.revision-00101/base-00045.png'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'Preparar la vista de referencia de 00045'
          git push origin HEAD:refs/heads/revision-2d-00101-paradigma
